<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="55%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <clipPath id="roundedWindow">
      <rect x="1" y="1" width="898" height="418" rx="14"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="418" rx="14" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.5"/>

  <g clip-path="url(#roundedWindow)">
    <rect x="0" y="0" width="900" height="40" fill="#120a24"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="20" r="6" fill="#27c93f"/>
    <text x="450" y="25" text-anchor="middle" fill="#8b8ba7" font-size="13">ilyas@lpu:~</text>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#2a1a4a" stroke-width="1"/>

    <g font-size="16" fill="#e2e8f0">
      <!-- line 1: whoami -->
      <text x="24" y="75" opacity="0">
        <tspan fill="#4ade80">ilyas@lpu:~$ </tspan><tspan fill="#e2e8f0">whoami</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="103" fill="#c084fc" opacity="0">
        Mohammad "Ilyas Alee" Dar — B.Tech CSE (AI &amp; ML), LPU
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.01s" fill="freeze"/>
      </text>

      <!-- line 2: focus.txt -->
      <text x="24" y="145" opacity="0">
        <tspan fill="#4ade80">ilyas@lpu:~$ </tspan><tspan fill="#e2e8f0">cat focus.txt</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="173" fill="#a855f7" opacity="0">
        &gt; multilingual NLP mapping rural voices to UN SDGs
        <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="199" fill="#a855f7" opacity="0">
        &gt; patent — swarm-intelligence framework for disaster response
        <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="225" fill="#a855f7" opacity="0">
        &gt; retro OS built from scratch — bootloader to filesystem, C/C++/Asm
        <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.01s" fill="freeze"/>
      </text>

      <!-- line 3: patent number -->
      <text x="24" y="267" opacity="0">
        <tspan fill="#4ade80">ilyas@lpu:~$ </tspan><tspan fill="#e2e8f0">grep -r "app_no" patent.txt</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="295" fill="#8b8ba7" opacity="0">
        Indian Patent Office · Application No. 2020511052485
        <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.01s" fill="freeze"/>
      </text>

      <!-- line 4: motto -->
      <text x="24" y="337" opacity="0">
        <tspan fill="#4ade80">ilyas@lpu:~$ </tspan><tspan fill="#e2e8f0">echo $MOTTO</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.01s" fill="freeze"/>
      </text>
      <text x="24" y="365" fill="#facc15" opacity="0">
        "Ship it. Measure it. Write it up."
        <animate attributeName="opacity" from="0" to="1" begin="7.3s" dur="0.01s" fill="freeze"/>
      </text>

      <!-- final prompt + blinking cursor -->
      <text x="24" y="400" fill="#4ade80" opacity="0">
        ilyas@lpu:~$
        <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.01s" fill="freeze"/>
      </text>
      <rect x="146" y="387" width="9" height="16" fill="#c084fc" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.01s" fill="freeze"/>
        <animate attributeName="opacity" values="1;0;1" begin="8.2s" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
