name: generate space invaders svg

on:
  schedule:
    - cron: "0 3 * * *"   # once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: UltimateStrength/space-invaders-contributions@v1
        with:
          github_user_name: ilyas-dar
          outputs: |
            dist/invaders.svg
            dist/invaders-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # bust GitHub's image cache: rewrite the ?v= query param in README.md
      # to this run's number, so the embedded image URL changes every run
      # and camo has to fetch the new file instead of serving a stale copy
      - name: bump cache-busting query param
        run: |
          sed -i "s/invaders\(-dark\)\?\.svg?v=[0-9]*/invaders\1.svg?v=${{ github.run_number }}/g" README.md
          if git diff --quiet README.md; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: bust cache for invaders svg (run ${{ github.run_number }})"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
